name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create draft release
        run: |
          export REPO="${{ github.repository }}"
          export TAG="${{ github.ref_name }}"
          export PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          export CHANGELOG=$(git log "$PREV_TAG..$TAG" --pretty=format:"* %s")
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export MODE="create"
          python3 build/release.py

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: --mac
          - os: windows-latest
            build_args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: runner.os == 'macOS'
        run: swiftc build/haptic.swift -o build/haptic
      - name: Build & Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release
        run: |
          export REPO="${{ github.repository }}"
          export TAG="${{ github.ref_name }}"
          export PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          export CHANGELOG=$(git log "$PREV_TAG..$TAG" --pretty=format:"* %s")
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export MODE="publish"
          python3 build/release.py