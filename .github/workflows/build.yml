name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: --mac
          - os: windows-latest
            build_args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compile haptic binary (macOS only)
        if: runner.os == 'macOS'
        run: swiftc build/haptic.swift -o build/haptic

      - name: Build & Publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (branch push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder ${{ matrix.build_args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: ignore

  # ── Create & publish release (after all builds are done) ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          echo "## What's Changed" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"* [%s](https://github.com/Devoid2/PhotoVault/commit/%H)" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md

      - name: Get release ID
        id: get_release
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            > /tmp/release.json
          echo "id=$(python3 -c "import json; d=json.load(open('/tmp/release.json')); print(d.get('id', ''))")" >> $GITHUB_OUTPUT

      - name: Create release if not exists
        if: steps.get_release.outputs.id == ''
        run: |
          cat /tmp/release-notes.md
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{
              "tag_name": "${{ github.ref_name }}",
              "name": "${{ github.ref_name }}",
              "body": '"$(python3 -c "import json; print(json.dumps(open('/tmp/release-notes.md').read()))")"',
              "draft": false,
              "prerelease": false
            }'

      - name: Update release notes if exists
        if: steps.get_release.outputs.id != ''
        run: |
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.get_release.outputs.id }}" \
            -d '{
              "body": '"$(python3 -c "import json; print(json.dumps(open('/tmp/release-notes.md').read()))")"',
              "draft": false
            }'